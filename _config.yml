  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

just_the_docs:
  heading_anchors: true
  nav_depth: 2
  nav_sort: manual

# Note: page order in the nav is controlled by each page's own front-matter
